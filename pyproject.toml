[project]
name = "reposleuth-toolkit"
version = "0.1.0"
description = "RepoSleuth - 无状态工具封装层：克隆预检 / AST 依赖图 / 风险扫描 / 仓库文本化"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
agent = ["langchain-core>=0.3"]
orchestrator = ["langgraph>=0.2", "langchain>=0.3", "langchain-openai>=0.2", "python-dotenv>=1.0"]
web = ["gradio>=4"]
mcp = ["mcp>=2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
